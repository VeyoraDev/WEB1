<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Easter Egg - Veyora Verification</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: linear-gradient(145deg, #0b0e1a 0%, #1a1f30 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 32px;
            padding: 45px 40px;
            max-width: 580px;
            width: 100%;
            box-shadow: 0 25px 60px rgba(0,0,0,0.7);
        }
        h1 {
            color: #fff;
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .sub {
            color: #a0aec0;
            text-align: center;
            font-size: 15px;
            margin-bottom: 32px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding-bottom: 20px;
        }
        .question {
            margin-bottom: 28px;
        }
        .question label {
            display: block;
            color: #e2e8f0;
            font-weight: 500;
            font-size: 16px;
            margin-bottom: 8px;
        }
        .question input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 16px;
            border: 2px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04);
            color: #fff;
            font-size: 15px;
            transition: 0.2s;
            outline: none;
        }
        .question input:focus {
            border-color: #7c5cfc;
            background: rgba(124, 92, 252, 0.08);
        }
        .question input.correct {
            border-color: #48bb78;
            background: rgba(72, 187, 120, 0.12);
        }
        .question input.wrong {
            border-color: #fc5c7c;
            background: rgba(252, 92, 124, 0.12);
        }
        .status {
            font-size: 14px;
            margin-top: 6px;
            min-height: 22px;
            color: #a0aec0;
        }
        .status.correct { color: #48bb78; }
        .status.wrong { color: #fc5c7c; }
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #7c5cfc, #5c3cfc);
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
            margin-top: 10px;
        }
        .btn:hover { transform: scale(1.02); opacity: 0.92; }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .result-box {
            margin-top: 28px;
            padding: 24px;
            border-radius: 20px;
            background: rgba(72, 187, 120, 0.08);
            border: 2px solid #48bb78;
            text-align: center;
            display: none;
        }
        .result-box.show { display: block; animation: fadeUp 0.5s ease; }
        .result-box h2 { color: #48bb78; font-size: 22px; margin-bottom: 8px; }
        .result-box p { color: #cbd5e0; font-size: 16px; }
        .result-box .highlight { color: #fff; font-weight: 700; background: rgba(124,92,252,0.25); padding: 4px 12px; border-radius: 12px; display: inline-block; margin-top: 6px; }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(18px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .lock { color: #718096; font-size: 13px; text-align: center; margin-top: 18px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🥚 Easter Egg</h1>
    <div class="sub">Verify your identity — answer all correctly</div>

    <div class="question">
        <label>1) What is Veyora's Telegram username? (include <code>@</code>)</label>
        <input type="text" id="q1" placeholder="e.g. @username" />
        <div class="status" id="s1"></div>
    </div>

    <div class="question">
        <label>2) What is Veyora's Telegram display name?</label>
        <input type="text" id="q2" placeholder="e.g. Veyora" />
        <div class="status" id="s2"></div>
    </div>

    <div class="question">
        <label>3) Which country is Veyora from?</label>
        <input type="text" id="q3" placeholder="e.g. Malaysia" />
        <div class="status" id="s3"></div>
    </div>

    <button class="btn" id="checkBtn">Check Answers</button>

    <div class="result-box" id="resultBox">
        <h2>✅ Correct!</h2>
        <p>Now go to the Telegram channel that appears in <strong>Veyora's profile</strong>.</p>
        <p style="margin-top: 8px; font-size: 14px; color: #a0aec0;">Hint: Check the channel linked in the bio.</p>
    </div>

    <div class="lock">🔐 One try at a time — fix wrong answers to proceed</div>
</div>

<script>
    const answers = {
        q1: "@vyoraci",
        q2: "veyora (@wksbyvy)",
        q3: "malaysia"
    };

    const inputs = {
        q1: document.getElementById('q1'),
        q2: document.getElementById('q2'),
        q3: document.getElementById('q3')
    };

    const statuses = {
        q1: document.getElementById('s1'),
        q2: document.getElementById('s2'),
        q3: document.getElementById('s3')
    };

    const checkBtn = document.getElementById('checkBtn');
    const resultBox = document.getElementById('resultBox');

    // Normalize helper
    function normalize(str) {
        return str.trim().toLowerCase().replace(/\s+/g, ' ');
    }

    function checkField(id) {
        const input = inputs[id];
        const status = statuses[id];
        const userAnswer = normalize(input.value);
        const correct = normalize(answers[id]);

        if (userAnswer === correct) {
            status.textContent = '✅ Correct!';
            status.className = 'status correct';
            input.className = 'correct';
            return true;
        } else if (input.value.trim() === '') {
            status.textContent = '';
            status.className = 'status';
            input.className = '';
            return false;
        } else {
            status.textContent = '❌ Wrong, try again';
            status.className = 'status wrong';
            input.className = 'wrong';
            return false;
        }
    }

    // Real-time check on blur / input
    ['q1', 'q2', 'q3'].forEach(id => {
        inputs[id].addEventListener('input', () => {
            checkField(id);
            resultBox.classList.remove('show');
        });
        inputs[id].addEventListener('blur', () => checkField(id));
    });

    checkBtn.addEventListener('click', () => {
        const allCorrect = ['q1', 'q2', 'q3'].every(id => checkField(id));

        if (allCorrect) {
            resultBox.classList.add('show');
            // Disable button to prevent spam
            checkBtn.disabled = true;
            checkBtn.textContent = '✅ Verified!';
        } else {
            resultBox.classList.remove('show');
            // Shake effect on button
            checkBtn.style.transform = 'scale(0.97)';
            setTimeout(() => checkBtn.style.transform = '', 200);
        }
    });

    // Enter key support
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') checkBtn.click();
    });
</script>

</body>
</html>
